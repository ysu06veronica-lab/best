<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F5EF">
<title>최고수학학원 · 시험 돌아보기 안내</title>
<link rel="stylesheet" href="/siheom/style.css">
</head>
<body class="parent">
<header class="top"><div class="brand">최고수학학원</div><div class="who">시험 돌아보기 안내</div></header>
<main class="wrap" id="app"><p class="sub" style="margin-top:20px">불러오는 중…</p></main>
<script src="/siheom/reasons.js"></script>
<script src="/siheom/core.js"></script>
<script>
/* 학부모 안내 페이지 (로그인 없음, 주소의 열쇠 t 로만 열림). 원장님 승인 뒤에만 열리고, 연락처는 다루지 않습니다.
   틀린 문항 · 원인 분석 · 풀이가 아쉬운 문항 · 4영역 · 단원별 득점률 · 담임 한마디 · 학습지 배송 안내 + '학습지 받았어요' */
const T = new URLSearchParams(location.search).get("t") || (DEMO ? "demo0000000000000000000000000001" : "");
const app = $("#app");
async function main() {
  let d;
  try { d = await api("parent_view", { t: T }); } catch (e) { app.innerHTML = `<div class="card" style="margin-top:20px">${esc(e.message)}</div>`; return; }
  const x = d.exam, e = d, W = (d.wrong || []).slice().sort((a, b) => a - b), RV = Object.keys(d.review || {}).map(Number).sort((a, b) => a - b);
  const total = x.items.reduce((s, it) => s + (+it.pts || 0), 0), score = scoreOf(x.items, W);
  const loss = areaLoss(x, e), lost = loss.reduce((s, r) => s + r[1], 0);
  const weak = loss.filter(([k]) => k && AREAS.includes(k)).slice(0, 2).map(([k]) => AREA_NAME[k]);
  const C = d.comments || {}, A = d.analysis || {};
  const img = no => d.crops[no] ? `<img class="crop" src="${esc(d.crops[no])}" alt="${no}번 문항" onclick="zoom(this.src)">` : "";
  app.innerHTML = `
    <section class="ph-hero"><p class="eyebrow">EXAM REVIEW</p><h1>${esc(d.student.name)} 학생<br>${esc(x.title)}</h1>
      <p class="sub">${esc(x.school)} ${esc(x.grade)}${d.student.teacher ? " · 담임 " + esc(d.student.teacher) + " 선생님" : ""}</p></section>
    <div class="card summary"><div><b>${fmt(score)}</b><span>/ ${fmt(total)}점</span></div><div><b>${W.length}</b><span>틀린 문항</span></div><div><b>${RV.length}</b><span>풀이가 아쉬운 문항</span></div></div>

    ${C.teacher ? `<h2>담임 선생님 한마디</h2><div class="card tc big"><p>${nl(C.teacher)}</p></div>` : ""}

    <h2>4가지 영역 중 보완할 부분</h2>
    <div class="card">${loss.length ? `${weak.length ? `<p class="lead">이번 시험에서는 <b>${weak.join("</b>와 <b>")}</b> 영역에서 놓친 점수가 가장 많았습니다.</p>` : ""}${bars(loss.map(([k, v]) => [AREA_NAME[k] || k, v, lost]), "점", "pe")}
      <p class="sub" style="margin-top:8px">놓친 점수를 원인 영역별로 나눈 것입니다. 한 문항에 원인이 여럿이면 배점을 나누어 셉니다.</p>` : `<p>놓친 점수가 없습니다.</p>`}</div>

    <h2>단원별 득점률</h2><div class="card">${bars(unitRates(x, W).map(([k, v]) => [k, v, 100]), "%")}</div>

    ${W.length ? `<h2>틀린 문항과 원인</h2><p class="sub">아이가 스스로 고른 원인과, 선생님이 아이의 풀이를 보고 분석한 내용입니다.</p>` : ""}
    ${W.map(no => { const it = x.items[no - 1] || {}, a = A[no] || {}, tr = (d.teacher_reasons || {})[no] || [];
      return `<div class="card an"><div class="h"><b>${no}번</b><span>${esc(it.unit || "")}${it.type ? " · " + esc(it.type) : ""} · ${fmt(+it.pts || 0)}점</span></div>${img(no)}
        <div class="lab">아이가 고른 원인</div><div class="rcs">${reasonChips((d.reasons || {})[no])}</div>
        ${tr.length ? `<div class="lab">선생님이 본 원인</div><div class="rcs">${reasonChips(tr)}</div>` : ""}
        ${(a.areas || []).length ? `<div class="lab">원인 영역</div><div class="rcs">${a.areas.map(t => `<span class="rc area">${esc(AREA_NAME[t] || t)}</span>`).join("")}</div>` : ""}
        ${a.stuck ? `<dl class="ana"><dt>막힌 곳</dt><dd>${esc(a.stuck)}</dd></dl>` : ""}${a.wrong ? `<dl class="ana"><dt>틀린 곳</dt><dd>${esc(a.wrong)}</dd></dl>` : ""}
        ${a.fix ? `<dl class="ana fix"><dt>다시 풀 때</dt><dd>${esc(a.fix)}</dd></dl>` : ""}</div>`; }).join("")}

    ${RV.length ? `<h2>정답이지만 풀이가 아쉬운 문항</h2><p class="sub">답은 맞았지만 풀이 과정이 틀렸거나 풀이 없이 답만 쓴 문항입니다. 학원에서 풀이를 쓰며 다시 풀게 합니다.</p>` : ""}
    ${RV.map(no => { const it = x.items[no - 1] || {}; return `<div class="card an"><div class="h"><b>${no}번</b><span>${esc(it.unit || "")}${it.type ? " · " + esc(it.type) : ""}</span></div>${img(no)}
      <dl class="ana"><dt>아쉬운 점</dt><dd>${esc(d.review[no].why || "")}</dd></dl>${(d.review_notes || {})[no] ? `<dl class="ana fix"><dt>선생님</dt><dd>${esc(d.review_notes[no])}</dd></dl>` : ""}</div>`; }).join("")}

    ${(C.plan || []).length ? `<h2>다음 시험까지 학원 관리 계획</h2><div class="card"><ol class="plan">${C.plan.map(p => `<li>${esc(p)}</li>`).join("")}</ol></div>` : ""}

    <h2>학습지 배송 안내</h2>
    <div class="card notice"><p>${esc(PARENT_NOTICE)}</p><p class="sub" style="margin-top:6px">${esc(PARENT_ACK_TXT)}</p>
      <div id="ack" style="margin-top:12px"></div></div>
    <p class="foot">최고수학학원 · 이 페이지는 ${esc(d.student.name)} 학생 학부모님께만 보내 드린 주소입니다.</p>`;
  drawAck(d.ack_at);
}
function drawAck(at) {
  const el = $("#ack");
  if (at) { el.innerHTML = `<div class="acked">✓ 학습지를 받으셨다고 전달했습니다 <span class="sub">(${md(at)})</span></div>`; return; }
  el.innerHTML = `<button class="btn main full" id="ackb">학습지 받았어요 (확인했음)</button>`;
  $("#ackb").onclick = async () => {
    if (!confirm("학습지를 받으셨나요? 담임 선생님께 전달됩니다.")) return;
    try { const r = await api("parent_ack", { t: T }); drawAck(r.ack_at); toast("감사합니다. 선생님께 전달했습니다"); } catch (e) { toast(e.message); }
  };
}
main();
</script>
</body>
</html>
